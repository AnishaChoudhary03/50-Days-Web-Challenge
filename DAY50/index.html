<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Synexus Core - Final Capstone"
    >

    <meta
        name="theme-color"
        content="#7c3aed"
    >

    <title>
        Synexus Core | Final Capstone
    </title>

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>

    <!-- =====================================
         OFFLINE/ONLINE STATUS
    ====================================== -->

    <div
        id="connection-status"
        class="connection-status"
        role="status"
    >
        🟢 Online
    </div>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="app-header">

        <div class="brand">

            <div class="brand-logo">
                SC
            </div>

            <div class="brand-info">

                <h1>
                    Synexus Core
                </h1>

                <span>
                    Final Capstone
                </span>

            </div>

        </div>


        <!-- NAVIGATION -->

        <nav
            class="main-nav"
            aria-label="Main Navigation"
        >

            <a
                href="#/"
                class="nav-link"
            >
                Home
            </a>

            <a
                href="#/users"
                class="nav-link"
            >
                Users
            </a>

            <a
                href="#/data"
                class="nav-link"
            >
                Data
            </a>

            <a
                href="#/about"
                class="nav-link"
            >
                About
            </a>

        </nav>


        <!-- THEME -->

        <button
            id="theme-toggle"
            class="theme-button"
            type="button"
            aria-label="Toggle dark mode"
        >
            🌙
        </button>

    </header>


    <!-- =====================================
         MAIN SPA ROOT
    ====================================== -->

    <main id="app-root">

        <section class="loading-screen">

            <div class="spinner"></div>

            <h2>
                Starting Synexus Core...
            </h2>

            <p>
                Preparing the application.
            </p>

        </section>

    </main>


    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="app-footer">

        <div>

            <strong>
                Synexus Core
            </strong>

            <p>
                50-Days-Web-Challenge
            </p>

        </div>


        <div>

            <p>
                Day 50 • Final Capstone
            </p>

            <p>
                Offline Ready • Vanilla JavaScript
            </p>

        </div>

    </footer>


    <!-- =====================================
         MAIN SCRIPT
    ====================================== -->

    <script
        type="module"
        src="./main.js"
    ></script>

</body>

</html>
